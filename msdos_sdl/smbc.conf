; Super Mario Bros. for MS-DOS -- settings (SMBC.CON)
; Anything left out takes its default.

[audio]
enabled=true
; 22050 suits every Sound Blaster and spares the CPU; 44100 on an SB16 / fast PC.
frequency=22050

[game]
frame_rate=60

[video]
; A palette file (64 colors, 192 bytes RGB), e.g. palette_file=NES.PAL
palette_file=
; Smoothing filters: slow on a 486, and in an 8-bit video mode they are
; rounded back to the 64 NES colors.
hqdn3d=false
antialiasing=false

[input]
; Keys, as SDL scancodes: 82 up, 81 down, 80 left, 79 right,
; 27 X, 29 Z, 229 right Shift, 40 Enter, 44 Space, 224 left Ctrl, 226 left Alt.
player1.key.up=82
player1.key.down=81
player1.key.left=80
player1.key.right=79
player1.key.a=27
player1.key.b=29
player1.key.select=229
player1.key.start=40
joystick.deadzone=12000
