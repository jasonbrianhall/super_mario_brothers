set timeout=0
set default=0
if [ "$grub_platform" = "efi" ]; then
    # UEFI: no VBE, and the firmware's graphics (GOP) usually offers just
    # the screen's own mode, which GRUB is already in: hand that over.
    # (Asking for 1024x768 there fails with "no suitable video mode found"
    # and the kernel is left with no framebuffer.)
    insmod all_video
    set gfxpayload=keep
else
    set gfxpayload=@GFXMODE@
fi

menuentry "Super Mario Bros. (bare metal)" {
    # Options: audio=hda|ac97|off, usb=off, debug (see README)
    multiboot /boot/smb.elf
    module /boot/smb.nes smb.nes
    boot
}
